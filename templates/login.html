<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — SkillMatch</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <!-- Animated Background -->
    <div class="animated-bg"></div>
    <div class="glow-overlay"></div>

<div class="page-center">

    <div class="glass-card">
        <p class="section-label">Welcome Back</p>
        <h2 style="font-family:'Syne',sans-serif;font-size:24px;font-weight:800;letter-spacing:-0.5px;color:var(--text-dark);margin-bottom:4px;">Sign In</h2>
        <p style="font-size:13px;color:var(--text-light);margin-bottom:28px;">Sign in to continue to your dashboard</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="flash {{ category }}">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form method="POST">
            <div class="field">
                <input type="email" name="email" id="email" placeholder=" " required>
                <label for="email">Email</label>
            </div>

            <div class="field">
                <input type="password" name="password" id="password" placeholder=" " required>
                <label for="password">Password</label>
            </div>

            <button type="submit" class="btn-primary">Sign In →</button>
        </form>

        <div class="auth-link">
            Don't have an account? <a href="/register">Create one</a>
        </div>
    </div>

</div>

</body>
</html>
